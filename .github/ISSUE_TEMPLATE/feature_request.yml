name: Feature request
description: Suggest an idea
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it belong in Dittoo?
      description: Dittoo stays focused on clipboard history. Explain how this supports that purpose.
    validations:
      required: true
