name: Release
run-name: Dittoo ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(awk '/MARKETING_VERSION:/ { gsub(/"/, "", $2); print $2 }' project.yml)"
          if [ "$VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project.yml version $PROJECT_VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 26 and install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          test -n "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v swiftlint >/dev/null || brew install swiftlint

      - name: Generate project and run tests
        run: |
          xcodegen generate
          ./Scripts/run-tests.sh

      - name: Lint
        env:
          SWIFTLINT_REPORTER: github-actions-logging
        run: ./Scripts/lint.sh

      - name: Clean Debug build
        run: |
          xcodebuild -project Dittoo.xcodeproj -scheme Dittoo \
            -configuration Debug -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Dittoo-debug" \
            clean build CODE_SIGNING_ALLOWED=NO -quiet

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::Set SIGNING_P12_BASE64 and SIGNING_P12_PASSWORD repository secrets."
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/Dittoo-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/Dittoo-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          # A fresh runner must trust this self-signed certificate for code signing.
          CERTIFICATE_PEM="$RUNNER_TEMP/Dittoo-signing.pem"
          security find-certificate -c 'Dittoo Self-Signed' -p "$KEYCHAIN_PATH" > "$CERTIFICATE_PEM"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CERTIFICATE_PEM"
          rm -f "$CERTIFICATE_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -F '"Dittoo Self-Signed"'

      - name: Build and package signed Release
        env:
          DITTOO_DERIVED_DATA_PATH: ${{ runner.temp }}/Dittoo-release
        run: ./Scripts/package-release.sh

      - name: Verify and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP_NAME="Dittoo-$VERSION-macOS-arm64.zip"
          (cd dist && shasum -a 256 -c "$ZIP_NAME.sha256")
          NOTES_PATH="$RUNNER_TEMP/release-notes.md"
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            cp "docs/releases/$GITHUB_REF_NAME.md" "$NOTES_PATH"
          else
            printf '# Dittoo %s\n' "$VERSION" > "$NOTES_PATH"
          fi
          cat >> "$NOTES_PATH" <<'NOTES'

          ## 安装 / Installation

          需要 macOS 26 或更高版本及 Apple Silicon Mac（arm64）。下载 ZIP 后解压，将 Dittoo.app 放入 Applications。
          此版本使用本地 Dittoo Self-Signed 身份签名，未经 Apple 公证。首次启动时，macOS 可能要求在“隐私与安全性”中确认。

          Requires macOS 26 or later on Apple Silicon (arm64). Extract the ZIP and move Dittoo.app to Applications.
          This build uses the local Dittoo Self-Signed identity and is not notarized by Apple. macOS may require
          confirmation in System Settings > Privacy & Security on first launch. A SHA-256 checksum accompanies the ZIP.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            "dist/$ZIP_NAME" "dist/$ZIP_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Dittoo $VERSION" --notes-file "$NOTES_PATH" --latest

      - name: Remove temporary signing material
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/Dittoo-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          if [ -f "$RUNNER_TEMP/Dittoo-signing.pem" ]; then
            sudo security remove-trusted-cert -d "$RUNNER_TEMP/Dittoo-signing.pem"
          fi
          rm -f "$RUNNER_TEMP/Dittoo-signing.p12" "$RUNNER_TEMP/Dittoo-signing.pem"
